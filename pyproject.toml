[project]
name = "free-llm-coder"
version = "0.1.0"
description = "A CLI tool to automate free LLM web services for coding assistance"
authors = [
    {name = "User", email = "user@example.com"},
]
dependencies = [
    "playwright>=1.40.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fc = "free_llm_coder.main:app"
free-llm-coder = "free_llm_coder.main:app"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
