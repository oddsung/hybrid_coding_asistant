# LLM Service Configuration

# Global settings
browser:
  headless: false # Set to true to run without visible browser window (after login)
  user_data_dir: "./user_data" # Path to store browser profiles/sessions

# Service Definitions
services:
  - name: "chatgpt"
    url: "https://chatgpt.com"
    priority: 1
    selectors:
      input_area: "#prompt-textarea"
      submit_button: "button[data-testid='send-button']"
      response_container: ".markdown"
      error_message: ".text-red-500" # Example selector

  - name: "gemini"
    url: "https://gemini.google.com"
    priority: 2
    selectors:
      input_area: "div[contenteditable='true']"
      submit_button: "button[aria-label='Send message']"
      response_container: "model-response"
      limit_message: "You have reached your limit"

  - name: "deepseek"
    url: "https://chat.deepseek.com"
    priority: 3
    selectors:
      input_area: "textarea"
      submit_button: "div.ds-send-button"
      response_container: "div.ds-markdown"

# Current active context settings
context:
  max_files: 10
  max_chars: 10000
  ignore_patterns:
    - "*.pyc"
    - "__pycache__"
    - ".git"
    - "node_modules"
    - "venv"
